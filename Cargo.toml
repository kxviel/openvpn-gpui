[package]
name = "openvpn-gpui"
version = "0.1.0"
edition = "2024"
description = "A small native Linux OpenVPN profile manager built with GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
shell-words = "1"
tempfile = "3"
fs2 = "0.4"
signal-hook = "0.3"

[profile.dev]
debug = 0

[profile.release]
strip = true
